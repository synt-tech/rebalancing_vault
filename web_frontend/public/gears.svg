<svg xmlns="http://www.w3.org/2000/svg" viewBox="137 111 105 120" width="400" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Four and three squares touching at corners</title>
  <desc id="desc">
    Five sets of equal-sized purple squares (#a020f0), each touching corner-to-corner and rotating like wheels:
    - 4-square ring at 90° (square side 10, radius 10)
    - 3-square ring at 120° (square side 10, radius ≈ 8.165)
    - 5-square ring at 72° (square side 10, radius ≈ 12.027)
    - 6-square ring at 60° (square side 10, radius ≈ 14.142)
    - 7-square ring at ~51.4286° (square side 10, radius ≈ 16.291)
  </desc>

  <defs>
    <!-- Base square: no internal rotation (α = 0), side = 10 -->
    <rect id="sq" x="-5" y="-5" width="10" height="10" fill="#a020f0" />
    <!-- Gold square for duplicated gear set (sgear gold) -->
    <rect id="sq-gold" x="-5" y="-5" width="10" height="10" fill="#ffd700" />

    <!-- sgear-style gold blurs: small and large -->
    <filter id="goldSmallSgear" filterUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000" style="color-interpolation-filters:sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.1719" result="bSmall" />
      <feFlood flood-color="#ffd700" flood-opacity="1" result="cSmall" />
      <feComposite in="cSmall" in2="bSmall" operator="in" result="hSmall" />
      <feMerge>
        <feMergeNode in="hSmall" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="goldLargeSgear" filterUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000" style="color-interpolation-filters:sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.3275" result="bLarge" />
      <feFlood flood-color="#ffd700" flood-opacity="1" result="cLarge" />
      <feComposite in="cLarge" in2="bLarge" operator="in" result="hLarge" />
      <feMerge>
        <feMergeNode in="hLarge" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle purple blur (sXTI-like), switch to userSpaceOnUse for reliability -->
    <filter id="purpleGlow" filterUnits="userSpaceOnUse" x="-1000" y="-1000" width="3000" height="3000" style="color-interpolation-filters:sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.557" result="pBlur" />
      <feFlood flood-color="#a020f0" flood-opacity="1" result="pColor" />
      <feComposite in="pColor" in2="pBlur" operator="in" result="pHalo" />
      <feMerge>
        <feMergeNode in="pHalo" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Duplicated gears in gold (bottom). Two stacked passes to match sgear: small blur @0.8 and large blur with multiply. -->
  <g transform="translate(-10,0)">
    <!-- Define gold geometry once: animated 3,4,5,6,7-square rings -->
    <g id="gold-geometry">
      <!-- 3-square ring (gold duplicate) -->
      <g transform="translate(181,213)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite" additive="sum" />
        <g transform="rotate(46)">
          <use href="#sq-gold" transform="translate(0,-8.165)" />
          <use href="#sq-gold" transform="rotate(120) translate(0,-8.165)" />
          <use href="#sq-gold" transform="rotate(240) translate(0,-8.165)" />
        </g>
      </g>

      <!-- 4-square ring (gold duplicate) -->
      <g transform="translate(198.337,169.819)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite" additive="sum" />
        <use href="#sq-gold" transform="translate(0,-10)" />
        <use href="#sq-gold" transform="rotate(90) translate(0,-10)" />
        <use href="#sq-gold" transform="rotate(180) translate(0,-10)" />
        <use href="#sq-gold" transform="rotate(270) translate(0,-10)" />
      </g>

      <!-- 5-square ring (gold duplicate) -->
      <g transform="translate(169,184.5)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          from="0 0 0" to="-360 0 0" dur="15s" repeatCount="indefinite" additive="sum" />
        <g transform="rotate(-66)">
          <use href="#sq-gold" transform="translate(0,-12.027)" />
          <use href="#sq-gold" transform="rotate(72) translate(0,-12.027)" />
          <use href="#sq-gold" transform="rotate(144) translate(0,-12.027)" />
          <use href="#sq-gold" transform="rotate(216) translate(0,-12.027)" />
          <use href="#sq-gold" transform="rotate(288) translate(0,-12.027)" />
        </g>
      </g>

      <!-- 6-square ring (gold duplicate) -->
      <g transform="translate(198.337,134.819)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          from="0 0 0" to="-360 0 0" dur="18s" repeatCount="indefinite" additive="sum" />
        <g transform="rotate(30)">
          <use href="#sq-gold" transform="translate(0,-14.142)" />
          <use href="#sq-gold" transform="rotate(60) translate(0,-14.142)" />
          <use href="#sq-gold" transform="rotate(120) translate(0,-14.142)" />
          <use href="#sq-gold" transform="rotate(180) translate(0,-14.142)" />
          <use href="#sq-gold" transform="rotate(240) translate(0,-14.142)" />
          <use href="#sq-gold" transform="rotate(300) translate(0,-14.142)" />
        </g>
      </g>

      <!-- 7-square ring (gold duplicate) -->
      <g transform="translate(215.19,202.91)">
        <animateTransform attributeName="transform" attributeType="XML" type="rotate"
          from="0 0 0" to="-360 0 0" dur="21s" repeatCount="indefinite" additive="sum" />
        <g transform="rotate(240)">
          <use href="#sq-gold" transform="translate(0,-16.291)" />
          <use href="#sq-gold" transform="rotate(51.4286) translate(0,-16.291)" />
          <use href="#sq-gold" transform="rotate(102.8571) translate(0,-16.291)" />
          <use href="#sq-gold" transform="rotate(154.2857) translate(0,-16.291)" />
          <use href="#sq-gold" transform="rotate(205.7143) translate(0,-16.291)" />
          <use href="#sq-gold" transform="rotate(257.1429) translate(0,-16.291)" />
          <use href="#sq-gold" transform="rotate(308.5714) translate(0,-16.291)" />
        </g>
      </g>
    </g>

    <!-- Pass 1: small blur, opacity 0.8 -->
    <use href="#gold-geometry" filter="url(#goldSmallSgear)" opacity="0.8" />
    <!-- Pass 2: large blur, multiply -->
    <use href="#gold-geometry" filter="url(#goldLargeSgear)" style="mix-blend-mode:multiply" />
  </g>

  <!-- Original purple gears wrapped to apply sXTI-like purple opacity and glow (top) -->
  <g id="purple-set" filter="url(#purpleGlow)" opacity="0.5">
  <!-- 3-square ring (120° apart), positioned to mesh with 5 and 7 -->
  <g transform="translate(181,213)">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite" additive="sum" />
    <!-- 3-square ring (120° apart), radius ≈ 81.65 to ensure corner contact -->
    <!-- Scaled: R ≈ 8.165. You can tweak slightly for anti-aliasing if needed. -->
    <!-- Add inner phase to guide 3–5 contact; tuned to ~+30° for better alignment with 5 -->
    <g transform="rotate(46)">
      <use href="#sq" transform="translate(0,-8.165)" />
      <use href="#sq" transform="rotate(120) translate(0,-8.165)" />
      <use href="#sq" transform="rotate(240) translate(0,-8.165)" />
    </g>
  </g>

  <!-- 4-square ring (90° apart), central gear meshing with 6, 5, and 7 -->
  <g transform="translate(198.337,169.819)">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite" additive="sum" />
    <!-- 4-square ring (90° apart), radius = 100 -->
    <!-- Scaled: R = 10 -->
    <use href="#sq" transform="translate(0,-10)" />
    <use href="#sq" transform="rotate(90) translate(0,-10)" />
    <use href="#sq" transform="rotate(180) translate(0,-10)" />
    <use href="#sq" transform="rotate(270) translate(0,-10)" />
  </g>

  <!-- 5-square ring (72° apart), positioned to mesh with 3 and 4 with the same gap as 4–6 -->
  <g transform="translate(169,184.5)">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="0 0 0" to="-360 0 0" dur="15s" repeatCount="indefinite" additive="sum" />
    <!-- Scaled: R ≈ 12.027 to maintain corner contact at 72° spacing -->
    <!-- Phase offset: rotate by -36° baseline, fine-tuned further to -62° for better 4–5 and re-established 5–3 interleaving after 3-set move -->
    <g transform="rotate(-66)">
      <use href="#sq" transform="translate(0,-12.027)" />
      <use href="#sq" transform="rotate(72) translate(0,-12.027)" />
      <use href="#sq" transform="rotate(144) translate(0,-12.027)" />
      <use href="#sq" transform="rotate(216) translate(0,-12.027)" />
      <use href="#sq" transform="rotate(288) translate(0,-12.027)" />
    </g>
  </g>

  <!-- 6-square ring (60° apart), meshing only with 4 -->
  <g transform="translate(198.337,134.819)">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="0 0 0" to="-360 0 0" dur="18s" repeatCount="indefinite" additive="sum" />
    <!-- Scaled: R ≈ 14.142 (= 10*sqrt(2)) to maintain corner contact at 60° spacing -->
    <!-- Add inner phase to interleave 6 with 4: offset by +30° (half of 60° spacing) -->
    <g transform="rotate(30)">
      <use href="#sq" transform="translate(0,-14.142)" />
      <use href="#sq" transform="rotate(60) translate(0,-14.142)" />
      <use href="#sq" transform="rotate(120) translate(0,-14.142)" />
      <use href="#sq" transform="rotate(180) translate(0,-14.142)" />
      <use href="#sq" transform="rotate(240) translate(0,-14.142)" />
      <use href="#sq" transform="rotate(300) translate(0,-14.142)" />
    </g>
  </g>

  <!-- 7-square ring (~51.4286° apart), positioned to mesh with 3 and 4 with the same gap as 4–6 -->
  <g transform="translate(215.19,202.91)">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="0 0 0" to="-360 0 0" dur="21s" repeatCount="indefinite" additive="sum" />
    <!-- Scaled: R ≈ 16.291 to maintain corner contact at 360/7° spacing -->
    <!-- Phase offset: fine-tuned so a gap faces the 3-set along the line of centers (~239°) -->
    <g transform="rotate(240)">
      <use href="#sq" transform="translate(0,-16.291)" />
      <use href="#sq" transform="rotate(51.4286) translate(0,-16.291)" />
      <use href="#sq" transform="rotate(102.8571) translate(0,-16.291)" />
      <use href="#sq" transform="rotate(154.2857) translate(0,-16.291)" />
      <use href="#sq" transform="rotate(205.7143) translate(0,-16.291)" />
      <use href="#sq" transform="rotate(257.1429) translate(0,-16.291)" />
      <use href="#sq" transform="rotate(308.5714) translate(0,-16.291)" />
    </g>
  </g>
  </g>
</svg>
