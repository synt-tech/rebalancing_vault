[package]
name = "cl_aquarius_strategy"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
defindex-strategy-core = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# Enables `SorobanArbitrary` on contracttypes for the fuzz crate.
testutils = ["soroban-sdk/testutils"]
