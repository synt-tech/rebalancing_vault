[workspace]
resolver = "2"
members = ["cl_aquarius", "null_router", "strategy_registry", "platform", "mocks", "strategy_core"]

[workspace.dependencies]
soroban-sdk = "29.0.1"
defindex-strategy-core = { path = "strategy_core" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

